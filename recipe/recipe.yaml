schema_version: 1

context:
  name: skrub
  version: "0.12.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/skrub-${{ version }}.tar.gz
  sha256: 7d660159aa1a83d9aa45de947c6cfc28b21966d59fbca301dfc6d2c3120af37f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.23.5
    - pandas >=1.5.3
    - scikit-learn >=1.5.2
    - scipy >=1.9.3
    - jinja2 >=3.1.2
    - matplotlib-base >=3.6.1
    - requests >=2.27.1
    - pydot
    - cloudpickle >=3.0
    - joblib >=1.4.0

tests:
  - python:
      imports:
        - skrub
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Machine learning for dataframes
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://github.com/skrub-data/skrub
  repository: https://github.com/skrub-data/skrub

extra:
  recipe-maintainers:
    - jeromedockes
    - Vincent-Maladiere
    - glemaitre
    - rcap107
    - lisaleemcb
